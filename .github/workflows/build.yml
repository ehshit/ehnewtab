name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  SLUG: ehs-new-tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: stage firefox
        run: |
          mkdir -p dist/firefox
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='manifest_chrome.json' \
            --exclude='build.json' \
            --exclude='changelogs.toml' \
            --exclude='amo-metadata.json' \
            --exclude='.gitignore' \
            ./ dist/firefox/
          printf 'globalThis.EH_BROWSER_SEARCH = false;\n' > dist/firefox/js/build-config.js
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            jq --arg v "$VERSION" '.version = $v' dist/firefox/manifest.json > dist/firefox/manifest.tmp
            mv dist/firefox/manifest.tmp dist/firefox/manifest.json
          fi

      - name: zip firefox
        run: |
          VERSION=$(jq -r '.version' dist/firefox/manifest.json)
          cd dist/firefox
          zip -r "../${SLUG}-firefox-${VERSION}.zip" .
          cd ../..

      - name: sign firefox
        id: sign
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          if [[ -z "$WEB_EXT_API_KEY" || -z "$WEB_EXT_API_SECRET" ]]; then
            echo "missing WEB_EXT_API_KEY / WEB_EXT_API_SECRET repo secrets" >&2
            exit 1
          fi
          mkdir -p dist/signed
          rm -f amo-metadata.json
          python3 - <<'PY'
          import json, re, sys
          try:
              import tomllib
              with open("changelogs.toml", "rb") as f:
                  data = tomllib.load(f)
              for date in sorted(data, reverse=True)[:1]:
                  blocks = data[date]
                  if isinstance(blocks, dict):
                      blocks = [blocks]
                  pieces = []
                  for block in blocks:
                      text = block.get("changelogtext", "").strip()
                      text = re.sub(r"(?m)^#+\s*", "", text)
                      if text:
                          pieces.append(date + "\n\n" + text)
              text = "\n\n".join(pieces)
              if text:
                  with open("amo-metadata.json", "w", encoding="utf-8") as f:
                      json.dump({"version": {"release_notes": {"en-US": text}}}, f, ensure_ascii=False)
          except FileNotFoundError:
              print("no changelogs.toml, signing without release notes", file=sys.stderr)
          except Exception as e:
              print("could not read changelogs.toml: " + str(e), file=sys.stderr)
          PY
          sign_args=()
          if [[ -f amo-metadata.json ]]; then
            sign_args+=(--amo-metadata amo-metadata.json)
          fi
          npx --yes web-ext@latest sign \
            --source-dir dist/firefox \
            --artifacts-dir dist/signed \
            --channel listed \
            --api-key "$WEB_EXT_API_KEY" \
            --api-secret "$WEB_EXT_API_SECRET" \
            "${sign_args[@]}" \
            --no-input
          VERSION=$(jq -r '.version' dist/firefox/manifest.json)
          mv dist/signed/*.xpi "dist/${SLUG}-firefox-${VERSION}.xpi"

      - name: grab firefox build (fallback)
        if: steps.sign.outcome == 'failure'
        env:
          AMO_SLUG: ehnewtab
        run: |
          VERSION=$(jq -r '.version' dist/firefox/manifest.json)
          OUT="dist/${SLUG}-firefox-${VERSION}.xpi"
          echo "oops! grabbing the XPI of ${VERSION}"
          if curl -fsSL "https://addons.mozilla.org/api/v5/addons/addon/${AMO_SLUG}/versions/${VERSION}/" -o /tmp/amo-version.json; then
            AMO_FILE=$(jq -r '.file.url // empty' /tmp/amo-version.json)
            if [[ -n "$AMO_FILE" ]] && curl -fsSL "$AMO_FILE" -o "$OUT"; then
              echo "grabbed $(basename "$OUT") from AMO"
              exit 0
            fi
          fi
          echo "::warning::wasn't able to grab a ver for it!!!!!!!!!!!!!!!"

      - name: build chrome variants
        run: |
          for variant in forced unlocked; do
            target="dist/chrome-${variant}"
            mkdir -p "$target"
            rsync -a \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='dist' \
              --exclude='manifest.json' \
              --exclude='manifest_chrome.json' \
              --exclude='build.json' \
              --exclude='changelogs.toml' \
              --exclude='amo-metadata.json' \
              --exclude='.gitignore' \
              ./ "$target/"
            cp manifest_chrome.json "$target/manifest.json"
            if [[ "$variant" == "forced" ]]; then
              flag=true
            else
              flag=false
            fi
            printf 'globalThis.EH_BROWSER_SEARCH = %s;\n' "$flag" > "$target/js/build-config.js"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              VERSION="${GITHUB_REF_NAME#v}"
              jq --arg v "$VERSION" '.version = $v' "$target/manifest.json" > "$target/manifest.tmp"
              mv "$target/manifest.tmp" "$target/manifest.json"
            fi
            VERSION=$(jq -r '.version' "$target/manifest.json")
            cd "$target"
            zip -r "../${SLUG}-chrome-${VERSION}-${variant}.zip" .
            cd ../..
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SLUG }}
          path: |
            dist/*.zip
            dist/*.xpi
          if-no-files-found: warn

      - name: write release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(jq -r '.version' dist/firefox/manifest.json)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          export VERSION BASE
          python3 - <<'PY'
          import os, re, sys

          version = os.environ["VERSION"]
          base = os.environ["BASE"]
          out = []
          changelog = []

          try:
              import tomllib
              with open("changelogs.toml", "rb") as f:
                  data = tomllib.load(f)
              for date in sorted(data, reverse=True)[:1]:
                  blocks = data[date]
                  if isinstance(blocks, dict):
                      blocks = [blocks]
                  for block in blocks:
                      text = block.get("changelogtext", "").strip()
                      text = re.sub(r"(?m)^#+\s*", "", text)
                      if text:
                          changelog.append("**" + date + "**\n\n" + text)
          except FileNotFoundError:
              print("no changelogs.toml, publishing without one", file=sys.stderr)
          except Exception as e:
              print("could not read changelogs.toml: " + str(e), file=sys.stderr)

          out.append(
              "> [!NOTE]\n"
              "> If you install it via the Firefox / Chrome Addons stores it might take a while for them to approve it."
          )

          if changelog:
              out.append("## Changelog")
              out.extend(changelog)
          out.append(
              "### Firefox\n\n"
              "| build | download |\n"
              "| --- | --- |\n"
              f"| zip | [ehs-new-tab-firefox-{version}.zip]({base}/ehs-new-tab-firefox-{version}.zip) |\n"
              f"| signed xpi | [ehs-new-tab-firefox-{version}.xpi]({base}/ehs-new-tab-firefox-{version}.xpi) |"
          )
          out.append(
              "### Chrome\n\n"
              "| variant | download |\n"
              "| --- | --- |\n"
              f"| forced (store-compliant) | [ehs-new-tab-chrome-{version}-forced.zip]({base}/ehs-new-tab-chrome-{version}-forced.zip) |\n"
              f"| unlocked (sideload) | [ehs-new-tab-chrome-{version}-unlocked.zip]({base}/ehs-new-tab-chrome-{version}-unlocked.zip) |"
          )

          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write("\n\n".join(out) + "\n")
          PY

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          body_path: release-notes.md
          files: |
            dist/*.zip
            dist/*.xpi